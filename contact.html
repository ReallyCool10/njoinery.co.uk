<body>
    <!-- Navigation -->
    <nav class="navbar navbar--solid" id="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <img src="images/logo.svg" alt="N Joinery" width="38" height="38">

            </ul>
            <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>
    <div class="nav-overlay" id="nav-overlay"></div>

    <!-- Page Header -->
    <section class="page-header">
        <div class="container">
            <h1 class="section-label">Start a Conversation</h1>
        </div>
    </section>

    <!-- Contact Content -->
    <section class="contact-section">
        <div class="container">
            <div class="contact-wrapper">
                <div class="contact-form-wrapper reveal reveal-delay-1">
                    <h2>Send us a Message</h2>
                    <!-- FOR PRODUCTION setup: Replace YOUR_FORM_ID below with your actual Formspree Form ID (e.g., https://formspree.io/f/xbjnqweo) -->
                    <form class="contact-form" id="contact-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
                        <!-- Formspree Honeypot anti-spam protection -->
                        <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" style="display:none !important">
                        <!-- Hidden email subject field -->
                        <input type="hidden" name="_subject" id="form-subject" value="New Inquiry from N Joinery Website">

                        <div class="form-row">
                            <div class="form-group">
                                <label for="contact-name">Your Name</label>
                                <input type="text" id="contact-name" name="name" placeholder="John Smith" required>
                            </div>
                            <div class="form-group">
                                <label for="contact-email">Email Address</label>
                                <input type="email" id="contact-email" name="email" placeholder="john@example.com" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="contact-phone">Phone Number</label>
                                <input type="tel" id="contact-phone" name="phone" placeholder="+44 7XXX XXXXXX">
                            </div>
                            <div class="form-group">
                                <label for="contact-project">Project Type</label>
                                <select id="contact-project" name="project">
                                    <option value="" disabled selected>Select a project type</option>
                                    <option>Fitted Wardrobe</option>
                                    <option>Built-in Shelving / Library</option>
                                    <option>Kitchen Cabinetry</option>
                                    <option>Architectural Panelling</option>
                                    <option>Doors (Residential / Ecclesiastical)</option>
                                    <option>Flooring & Inlay</option>
                                    <option>Sauna Build</option>
                                    <option>Bespoke Furniture</option>
                                    <option>Other</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="contact-message">Message</label>
                            <textarea id="contact-message" name="message" rows="5" required></textarea>
                        </div>

                        <!-- Status Notification Box -->
                        <div id="form-status" class="form-status" role="status" aria-live="polite"></div>

                        <button type="submit" class="btn btn--primary submit-button" id="submit-btn">
                            <span class="btn-text">Send Inquiry</span>
                            <span class="btn-arrow">→</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </section>
    <!-- Footer -->
    <footer class="footer">
        <div class="footer-accent-content">
            <p>Artistry. Precision. Durability.</p>
        </div>
        <div class="container">

                    <li><a href="contact.html">Contact</a></li>
                </ul>
            
            </div>
        </div>
    </footer>
